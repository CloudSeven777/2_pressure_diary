<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Дневник давления</title>

    <a href="{% url 'add_pressure' %}">Добавить запись</a>

</head>
<body>

    <h1>Дневник давления</h1>

    {% for record in records %}
        <p>
            {{ record.systolic }}/{{ record.diastolic }},
            пульс {{ record.pulse }},
            {{ record.created_at }}
        </p>
    {% empty %}
        <p>Записей пока нет.</p>
    {% endfor %}

</body>
</html>
